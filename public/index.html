<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha loja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>🏪Minha Loja</h1>

        <form id="forumlario">
            <h2 id="titulo-form"> Cadastrar produto</h2>
            <input type="text" id="nome" placeholder="Nome do produto">
            <div class="botoes">
                <button type="submit" id="botao-salvar">Cadastrar</button>
                <button type="button" id="botao-cancelar" hidden>Cancelar</button>
            </div>
            <p id="mensagem"></p>
        </form>

        <h2>Produtos</h2>
        <ul id="lista"></ul>
    </main>
</body>
</html>
